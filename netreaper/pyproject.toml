[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netreaper"
version = "0.1.0"
description = "Modular network attack and device configuration audit framework for internal penetration tests"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "YOUR NAME", email = "you@example.com" }]
keywords = ["pentest", "network-security", "cisco", "snmp", "audit", "oscp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
]

dependencies = []

[project.optional-dependencies]
snmp = ["pysnmp>=6.0"]
l2   = ["scapy>=2.5"]
dev  = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]

[project.scripts]
netreaper = "netreaper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netreaper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
