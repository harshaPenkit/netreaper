!
version 17.9
service timestamps debug datetime msec
service password-encryption
hostname CORE-RTR01
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
!
enable secret 9 $9$examplehashexamplehashexamplehashexample$
!
no ip http server
ip ssh version 2
ip ssh server algorithm encryption aes256-gcm aes256-ctr
!
snmp-server group MON-GRP v3 priv
snmp-server user monitor MON-GRP v3 auth sha256 AuthStrongPass priv aes 256 PrivStrongPass
!
logging buffered 16384
logging host 10.20.0.5
!
ip access-list extended MGMT-ACL
 permit ip 10.20.0.0 0.0.0.255 any
!
line vty 0 4
 access-class MGMT-ACL in
 transport input ssh
 login authentication default
line vty 5 15
 access-class MGMT-ACL in
 transport input ssh
 login authentication default
!
end
